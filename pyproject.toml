[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-agentic-taskmaster"
version = "1.0.0"
description = "Provider-neutral autonomous multi-stage innovation and taskmaster engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "pip-audit>=2.9.0",
    "build>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-include = ["*.py", "*.pyi"]
extend-exclude = [
    "run_500.py",
    "src/supra_agentic/integrations/criba_bridge.py",
    "src/supra_agentic/providers/__init__.py",
    "src/supra_agentic/providers/base.py",
    "src/supra_agentic/providers/hermes.py",
    "tests/test_honest_verification.py",
]

[tool.ruff.lint]
# Errores lógicos (F), estilo básico (E, W), imports (I),
# modernización (UP), bugs comunes (B)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP042", "W293"]

unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ejemplo: ignora warnings en módulos muy experimentales
# "agents/experimental/*.py" = ["F401", "F841"]
# "scripts/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
