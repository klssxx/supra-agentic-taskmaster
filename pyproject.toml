[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-agentic-taskmaster"
version = "1.0.0"
description = "Provider-neutral autonomous multi-stage innovation and taskmaster engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.5",
    "mypy>=1.8.0",
    "pip-audit>=2.9.0",
    "bandit>=1.9.0",
    "pre-commit>=4.6.0",
    "semgrep>=1.176.0",
    "cyclonedx-bom>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
