[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-agentic-taskmaster"
version = "1.0.0"
description = "Provider-neutral autonomous multi-stage innovation and taskmaster engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.5",
    "mypy>=1.8.0",
    "pip-audit>=2.9.0",
    "bandit>=1.9.0",
    "pre-commit>=4.6.0",
    "semgrep>=1.176.0",
    "cyclonedx-bom>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# SUP-13 (D7.1/D7.2): empezar conservador. E9 (errores de runtime) + F
# (pyflakes) es el set que ya pasa en el codigo no protegido. Los modulos
# protegidos (agent/runner/service/state/tools/mcp_handler) quedan EXCLUIDOS
# del check y del format hasta que moli autorice limpiarlos (auditoria Fase 1,
# items B-2..B-5/B-7); ampliar select y quitar el exclude solo con autorizacion.
extend-exclude = [
    "src/supra_agentic/agent.py",
    "src/supra_agentic/runner.py",
    "src/supra_agentic/service.py",
    "src/supra_agentic/state.py",
    "src/supra_agentic/tools.py",
    "src/supra_agentic/mcp_handler.py",
]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
# SUP-13 (D7.1): no estricto a proposito; el repo no tiene cobertura de tipos
# completa. Subir la rigurosidad por pasos, nunca de golpe.
plugins = []
warn_unused_configs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
no_strict_optional = true
ignore_missing_imports = true