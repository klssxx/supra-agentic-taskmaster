name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v10.1.0, tag verified with git ls-remote on 2026-09-20.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supra-agentic-taskmaster-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error