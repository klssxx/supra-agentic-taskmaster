name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  astra-canon:
    name: ASTRA canon
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Enforce ASTRA canon contracts
        shell: pwsh
        run: uv run --locked pytest -q tests/astra_canon

  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      # v10.1.0, tag verified with git ls-remote on 2026-09-20.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Run tests
        shell: pwsh
        run: uv run --locked pytest -q --no-header

  lint-types:
    name: lint & types
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      # v10.1.0, tag verified with git ls-remote on 2026-09-20.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Ruff check
        shell: pwsh
        run: uv run --locked ruff check .
      - name: Ruff format check
        shell: pwsh
        run: uv run --locked ruff format --check .
      - name: Type-check (non-strict)
        shell: pwsh
        run: uv run --locked mypy src/supra_agentic

  dependency-audit:
    name: dependency audit
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      # v10.1.0, tag verified with git ls-remote on 2026-09-20.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Export locked public dependencies
        shell: pwsh
        run: uv export --all-extras --locked --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - name: Fail on known vulnerable dependencies
        shell: pwsh
        run: uv run --locked pip-audit --requirement requirements-audit.txt --strict --require-hashes --progress-spinner off

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v3.0.0, tag verified with git ls-remote on 2026-09-20.
      - uses: zricethezav/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repository-scan:
    name: repository scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and verify Trivy for Linux
        shell: bash
        run: |
          set -euo pipefail
          archive="trivy_0.72.0_Linux-64bit.tar.gz"
          toolDir="trivy-0.72.0"
          expected="bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.72.0/${archive}" -o "${archive}"
          actual=$(sha256sum "${archive}" | cut -d' ' -f1)
          if [ "${actual}" != "${expected}" ]; then
            echo "Trivy checksum mismatch: ${actual}"
            exit 1
          fi
          mkdir -p "${toolDir}"
          tar -xzf "${archive}" -C "${toolDir}"
          echo "TRIVY_EXE=$(pwd)/${toolDir}/trivy" >> $GITHUB_ENV
      - name: Fail on HIGH or CRITICAL source findings
        shell: bash
        run: |
          set -euo pipefail
          ${TRIVY_EXE} fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs .git \
            --skip-dirs .venv \
            --skip-dirs build \
            --skip-dirs dist \
            .

  package:
    name: package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.1.0, tag verified with git ls-remote on 2026-09-20.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Build distributions
        run: uv build

  docker:
    name: docker build & health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1, tag verified with git ls-remote on 2026-09-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build -t supra-ci .
      - name: Run container & health check
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name supra-test -p 8080:8080 supra-ci
          # Wait for health endpoint
          for i in {1..30}; do
            if curl -fs http://localhost:8080/health >/dev/null 2>&1; then
              echo "Health check passed"
              docker stop supra-test
              docker rm supra-test
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs supra-test
          docker stop supra-test
          docker rm supra-test
          exit 1

  sandbox_e2e:
    name: secure sandbox E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPRA_RUN_DOCKER_E2E: "1"
      SUPRA_SANDBOX_IMAGE: "python:3.12-alpine"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --all-extras --locked
      - name: Pre-pull sandbox image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${SUPRA_SANDBOX_IMAGE}"
          docker image inspect --format='{{.Id}}' "${SUPRA_SANDBOX_IMAGE}"
      - name: Execute real isolated completion smoke
        run: uv run --locked pytest -q tests/test_secure_sandbox_e2e.py

  ci-result:
    name: ci-result
    needs: [astra-canon, quality, lint-types, dependency-audit, secret-scan, repository-scan, package, docker, sandbox_e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      ASTRA_CANON_RESULT: ${{ needs.astra-canon.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      LINT_TYPES_RESULT: ${{ needs.lint-types.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      REPOSITORY_SCAN_RESULT: ${{ needs.repository-scan.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
      SANDBOX_E2E_RESULT: ${{ needs.sandbox_e2e.result }}
    steps:
      - name: Enforce every required check
        shell: bash
        run: |
          for check in ASTRA_CANON_RESULT QUALITY_RESULT LINT_TYPES_RESULT DEPENDENCY_AUDIT_RESULT SECRET_SCAN_RESULT REPOSITORY_SCAN_RESULT PACKAGE_RESULT DOCKER_RESULT SANDBOX_E2E_RESULT; do
            value="${!check}"
            if [ "$value" != "success" ]; then
              echo "$check did not pass: $value" >&2
              exit 1
            fi
          done